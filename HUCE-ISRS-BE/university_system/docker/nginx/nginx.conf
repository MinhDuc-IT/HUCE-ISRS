server {
    listen 80;
    server_name university-huce.duckdns.org;
    return 301 https://$host$request_uri;
}

# 2. Cấu hình HTTPS chính thức cho ứng dụng
server {
    listen 443 ssl;
    server_name university-huce.duckdns.org;

    # --- ĐƯỜNG DẪN FILE SSL ĐÃ MOUNT VÀO TRONG CONTAINER ---
    ssl_certificate /etc/letsencrypt/live/university-huce.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/university-huce.duckdns.org/privkey.pem;

    # Tối ưu hóa bảo mật mã hóa SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 16M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 120;   # SQL Server queries có thể chậm hơn
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Swagger UI assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
