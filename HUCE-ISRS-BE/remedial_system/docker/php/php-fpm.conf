[www]
user = www-data
group = www-data
listen = 0.0.0.0:9000
listen.owner = www-data
listen.group = www-data

pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

; Log stderr của PHP lên stdout Docker
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
